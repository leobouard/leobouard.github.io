{% assign short_url = include.url %}
<div class="sovcloudfr-link hover-bottom">
  <h4>{{ include.name }}</h4>
  <a href="https://{{ include.url }}/" target="_blank">{{ short_url | truncate: 55, "…" }}</a>
  <img src="/assets/microsoft_icons/{{ include.icon }}.svg" alt="Icône de {{ include.name }} au format SVG"/>
</div>
